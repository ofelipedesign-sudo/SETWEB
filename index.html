    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9wZmdvb2lnc2d5cGd6Y2FlaHJmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE5MTQ3MjksImV4cCI6MjEwNzQ5MDcyOX0.3NRYTFNzSa7KcGdB00bGm2wBUgoK9-EMloaCT00b-K4';

    window.initTheme = function() {
      try {
        const savedTheme = localStorage.getItem('set_theme');
        const isDark = savedTheme ? savedTheme === 'dark' : true;
        document.documentElement.classList.toggle('dark', isDark);
      } catch (e) {}

      try {
        localStorage.setItem('set_theme', isDark ? 'dark' : 'light');

    window.showAuth = function() {
      const a = document.getElementById('authScreen');
      const c = document.getElementById('appContainer');
      if (a) a.classList.remove('hidden');
      if (c) c.classList.add('hidden');
    };

    window.showApp = function() {
      const a = document.getElementById('authScreen');
      const c = document.getElementById('appContainer');
      if (a) a.classList.add('hidden');
      if (c) c.classList.remove('hidden');
    };

    window.setAuthMode = function(mode) {
      window.currentAuthMode = mode;
      const tabLog = document.getElementById('tabAuthLogin');
      const tabReg = document.getElementById('tabAuthRegister');
      const btn = document.getElementById('btnAuthSubmit');
      if (!tabLog || !tabReg || !btn) return;

      if (mode === 'login') {
        tabLog.className = "flex-1 py-2.5 rounded-lg bg-slate-700 text-white shadow-sm transition";
        tabReg.className = "flex-1 py-2.5 rounded-lg text-slate-400 transition";
        btn.textContent = "Aceder ao SET";
      } else {
        tabReg.className = "flex-1 py-2.5 rounded-lg bg-slate-700 text-white shadow-sm transition";
        tabLog.className = "flex-1 py-2.5 rounded-lg text-slate-400 transition";
        btn.textContent = "Criar Minha Conta";
      }
    };

    window.handleAuthSubmit = async function(e) {
      if (e) {
        e.preventDefault();
        e.stopPropagation();
      }

      if (!window.supabaseClient) {
        alert('Cliente Supabase não inicializado.');
        return false;
      }

      const emailInput = document.getElementById('authEmail');
      const passInput = document.getElementById('authPassword');
      const btn = document.getElementById('btnAuthSubmit');

      if (!emailInput || !passInput) return false;

      const email = emailInput.value.trim();
      const password = passInput.value;

      if (btn) {
        btn.disabled = true;
        btn.textContent = 'Processando...';
      }

      try {
        if (window.currentAuthMode === 'register') {
          const { data, error } = await window.supabaseClient.auth.signUp({ email, password });
          if (error) throw error;
          
          if (data && data.session && data.user) {
            window.currentUser = data.user;
            window.showApp();
            window.loadAllData().catch(e => console.warn(e));
          } else {
            alert('Conta criada com sucesso! Pode agora iniciar sessão.');
            window.setAuthMode('login');
          }
        } else {
          const { data, error } = await window.supabaseClient.auth.signInWithPassword({ email, password });
          if (error) throw error;
          
          window.currentUser = data.user;
          window.showApp();
          window.loadAllData().catch(e => console.warn(e));
        }
      } catch (err) {
        alert('Erro ao autenticar: ' + (err.message || 'Credenciais inválidas.'));
      } finally {
        if (btn) {
          btn.disabled = false;
          btn.textContent = window.currentAuthMode === 'login' ? 'Aceder ao SET' : 'Criar Minha Conta';
        }
      }
      return false;
    };

    window.signOut = async function() {
      if (window.supabaseClient) await window.supabaseClient.auth.signOut();
      window.currentUser = null;
      window.showAuth();
    };

    function addLog(msg) {
      try {
        const logs = JSON.parse(localStorage.getItem('set_logs') || '[]');
        const timestamp = new Date().toLocaleTimeString();
        logs.unshift(`[${timestamp}] ${msg}`);
        localStorage.setItem('set_logs', JSON.stringify(logs.slice(0, 50)));
      } catch (e) {}
    }

    function renderProgressStep() {
      if (currentProgress < targetProgress) {
        currentProgress += Math.max(1, Math.ceil((targetProgress - currentProgress) * 0.12));
        if (currentProgress > targetProgress) currentProgress = targetProgress;

        const bar = document.getElementById('loadingProgressBar');
        const pctLabel = document.getElementById('loadingPercentLabel');
        if (bar) bar.style.width = currentProgress + '%';
        if (pctLabel) pctLabel.textContent = Math.round(currentProgress) + '%';
      }

      if (currentProgress < 100) {
        progressRafId = requestAnimationFrame(renderProgressStep);
      }
    }

    function animateProgressTo(target, stepLabelText) {
      targetProgress = Math.min(100, Math.max(0, target));
      if (stepLabelText) {
        const lbl = document.getElementById('loadingStepLabel');
        if (lbl) lbl.textContent = stepLabelText;
      }
      if (!progressRafId) {
        progressRafId = requestAnimationFrame(renderProgressStep);
      }
    }

    function showLoading(title, subtext, initialProgress = 1, stepText = 'A iniciar...') {
      cancelAnimationFrame(progressRafId);
      progressRafId = null;
      currentProgress = 0;
      targetProgress = initialProgress;

      const titleEl = document.getElementById('loadingTitle');
      const subEl = document.getElementById('loadingSubtext');
      const bar = document.getElementById('loadingProgressBar');
      const pctLabel = document.getElementById('loadingPercentLabel');
      const stepLabel = document.getElementById('loadingStepLabel');
      const modal = document.getElementById('modalLoading');

      if (titleEl) titleEl.textContent = title || 'Processando com IA...';
      if (subEl) subEl.textContent = subtext || 'A analisar os dados da fatura';
      if (bar) bar.style.width = '0%';
      if (pctLabel) pctLabel.textContent = '0%';
      if (stepLabel) stepLabel.textContent = stepText;
      if (modal) modal.classList.remove('hidden');

      animateProgressTo(initialProgress, stepText);
    }

    function hideLoading() {
      cancelAnimationFrame(progressRafId);
      progressRafId = null;
      const modal = document.getElementById('modalLoading');
      if (modal) modal.classList.add('hidden');
    }

    window.switchTab = function(tab) {
      ['dashboard', 'invoices', 'transactions', 'members', 'banks'].forEach(t => {
        const view = document.getElementById('view' + t.charAt(0).toUpperCase() + t.slice(1));
        if (view) view.classList.add('hidden');
      });

      const selected = document.getElementById('view' + tab.charAt(0).toUpperCase() + tab.slice(1));
      if (selected) selected.classList.remove('hidden');

      ['Dash', 'Invoices', 'Trans', 'Members', 'Banks'].forEach(t => {
        const btn = document.getElementById('tabNav' + t);
        if (btn) {
          btn.className = "px-4 py-2 rounded-lg text-sm font-medium transition text-slate-400 hover:text-white hover:bg-slate-800 flex items-center gap-2";
        }
      });
      const activeBtn = document.getElementById('tabNav' + tab.charAt(0).toUpperCase() + tab.slice(1));
      if (activeBtn) {
        activeBtn.className = "px-4 py-2 rounded-lg text-sm font-semibold transition bg-emerald-950/40 text-emerald-300 border border-emerald-800 flex items-center gap-2";
      }

      if (tab === 'dashboard') {
        renderCharts();
      }
    };

    window.toggleSetMenuDropdown = function() {
      const dd = document.getElementById('setMenuDropdown');
      if (dd) dd.classList.toggle('hidden');
    };

    window.closeSetMenuDropdown = function() {
      const dd = document.getElementById('setMenuDropdown');
      if (dd) dd.classList.add('hidden');
    };

    window.triggerInvoiceUpload = function() {
      const input = document.getElementById('pdfFileInput');
      if (input) input.click();
    };

    window.handleFileSelected = async function(e) {
      const file = e.target.files[0];
      if (!file) return;

      let apiKey = '';
      try {
        apiKey = localStorage.getItem('set_gemini_key') || '';
      } catch (err) {}

      if (!apiKey) {
        window.openConfigModal();
        alert('Por favor, configure a chave Gemini API no menu de configurações antes de processar faturas.');
        e.target.value = '';
        return;
      }

      showLoading('A ler ficheiro PDF...', 'A extrair páginas e conteúdo textual', 15, 'A ler PDF');

      try {
        addLog(`A processar ficheiro PDF: ${file.name}`);
        const arrayBuffer = await file.arrayBuffer();
        const pdf = await window.pdfjsLib.getDocument({ data: arrayBuffer }).promise;
        let textContent = '';

        for (let i = 1; i <= pdf.numPages; i++) {
          const page = await pdf.getPage(i);
          const content = await page.getTextContent();
          textContent += ' ' + content.items.map(item => item.str).join(' ');
          const pagePct = Math.round(15 + (i / pdf.numPages) * 20);
          animateProgressTo(pagePct, `A ler página ${i}/${pdf.numPages}`);
        }

        const titleEl = document.getElementById('loadingTitle');
        const subEl = document.getElementById('loadingSubtext');
        if (titleEl) titleEl.textContent = 'IA a Analisar Fatura...';
        if (subEl) subEl.textContent = 'O Gemini está a estruturar valores, vencimento e compras';
        animateProgressTo(50, 'A contactar Gemini IA');

        await window.processPdfWithGemini(textContent, apiKey);
      } catch (err) {
        hideLoading();
        alert('Erro ao ler PDF: ' + err.message);
      } finally {
        e.target.value = '';
      }
    };

    window.parseInvoiceWithAI = async function(pdfText, apiKey) {
      const prompt = `Você é um motor contábil especialista em conciliação de faturas de cartões de crédito e extratos bancários.
Analise o texto extraído da fatura e retorne as informações em JSON estruturado estrito.

REGRAS:
1. "bank_name": Identifique o banco emissor (ex: "Bradesco", "Santander", "Nubank", "Itaú", "Inter", "C6").
2. "due_date": Data de vencimento no formato YYYY-MM-DD.
3. "total_amount": O valor total final da fatura a pagar (número decimal, ex: 1394.47). IGNORE opções de parcelamento fácil, crédito rotativo ou limites futuros.
4. "items": Lista contendo cada transação ou lançamento individual presente na fatura:
   - "description": Nome limpo do estabelecimento ou detalhe.
   - "date": Data da compra (YYYY-MM-DD ou aproximada para o mês/ano do documento).
   - "amount": Valor decimal positivo referente ao lançamento cobrado no mês.
   - "category": Categoria (Alimentação, Compras Online, Saúde, Lazer, Tecnologia, Transporte, Outros).
   - "installment_current": Número inteiro da parcela cobrada nesta fatura (ex: se for 07/12, informe 7). Se for compra à vista, retorne null.
   - "installment_total": Número inteiro da quantidade total de parcelas contratadas (ex: se for 07/12, informe 12). Se for compra à vista, retorne null.
   - "installment_display": String no formato "X/Y" (ex: "7/12", "2/2"). Se à vista, retorne "-".

Retorne EXCLUSIVAMENTE o JSON no formato:
{
  "bank_name": "string",
  "due_date": "YYYY-MM-DD",
  "total_amount": 0.00,
  "items": [
    {
      "description": "string",
      "date": "YYYY-MM-DD",
      "amount": 0.00,
      "category": "string",
      "installment_current": null,
      "installment_total": null,
      "installment_display": "-"
    }
  ]
}

TEXTO DA FATURA:
${pdfText.slice(0, 14000)}`;

      let candidateEndpoints = [];

      try {
        animateProgressTo(60, 'Descobrindo modelos disponíveis');
        const listResp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${apiKey}`);
        if (listResp.ok) {
          const listData = await listResp.json();
          const validModels = (listData.models || [])
            .filter(m => m.supportedGenerationMethods && m.supportedGenerationMethods.includes('generateContent'))
            .map(m => m.name.replace('models/', ''));

          const flashModels = validModels.filter(m => m.includes('flash'));
          const otherModels = validModels.filter(m => !m.includes('flash'));
          const ordered = [...flashModels, ...otherModels];

          ordered.forEach(m => {
            candidateEndpoints.push(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent`);
          });
        }
      } catch (errList) {
        console.warn('Fallback da lista de modelos:', errList);
      }

      if (candidateEndpoints.length === 0) {
        candidateEndpoints = [
          'https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent',
          'https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash-latest:generateContent',
          'https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent',
          'https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent'
        ];
      }

      let lastError = null;

      for (const endpoint of candidateEndpoints) {
        try {
          animateProgressTo(75, 'A interpretar compras e parcelas');
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 25000);

          const response = await fetch(`${endpoint}?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            signal: controller.signal,
            body: JSON.stringify({
              contents: [{ parts: [{ text: prompt }] }],
              generationConfig: { temperature: 0.1 }
            })
          });

          clearTimeout(timeoutId);

          if (!response.ok) {
            const errorData = await response.json().catch(() => ({}));
            lastError = new Error(errorData.error?.message || `HTTP ${response.status}`);
            continue;
          }

          animateProgressTo(90, 'A estruturar lançamentos');
          const data = await response.json();
          let rawText = data.candidates?.[0]?.content?.parts?.[0]?.text;

          if (!rawText) throw new Error('Sem resposta textual da IA.');

          rawText = rawText.replace(/```json/gi, '').replace(/```/g, '').trim();
          return JSON.parse(rawText);
        } catch (err) {
          lastError = err;
        }
      }

      throw lastError || new Error('Não foi possível estabelecer conexão com o Gemini.');
    };

    window.processPdfWithGemini = async function(textContent, apiKey) {
      try {
        const parsed = await window.parseInvoiceWithAI(textContent, apiKey);
        window.pendingParsedInvoice = parsed;
        addLog(`Fatura interpretada: ${parsed.bank_name} (R$ ${parsed.total_amount})`);

        animateProgressTo(100, 'Concluído com sucesso');
        setTimeout(() => {
          hideLoading();
          window.showInvoiceAIModal(parsed);
        }, 400);
      } catch (err) {
        hideLoading();
        alert('Erro ao interpretar com IA: ' + err.message + '\n\nVerifique se a chave Gemini no menu Funções > Configurações está válida e com cota.');
      }
    };

    window.showInvoiceAIModal = function(data) {
      document.getElementById('aiBankName').value = data.bank_name || 'Cartão';
      document.getElementById('aiDueDate').value = data.due_date || new Date().toISOString().split('T')[0];
      document.getElementById('aiTotalAmount').value = Number(data.total_amount).toFixed(2);
      document.getElementById('aiItemsCount').textContent = (data.items || []).length;

      const container = document.getElementById('aiItemsContainer');
      container.innerHTML = '';
      (data.items || []).forEach(item => {
        const div = document.createElement('div');
        div.className = 'py-2 flex items-center justify-between';
        const instBadge = (item.installment_display && item.installment_display !== '-') ? 
          `<span class="ml-1 text-[9px] px-1.5 py-0.2 bg-slate-800 rounded text-slate-400 font-bold font-mono">Parc: ${item.installment_display} (Total: ${item.installment_total || '-'})</span>` : '';
        div.innerHTML = `
          <div>
            <p class="font-bold text-slate-100">${item.description} ${instBadge}</p>
            <p class="text-[10px] text-slate-400">${item.date} • ${item.category || 'Geral'}</p>
          </div>
          <span class="font-bold text-rose-400">R$ ${Number(item.amount).toFixed(2)}</span>
        `;
        container.appendChild(div);
      });

      document.getElementById('modalInvoiceAI').classList.remove('hidden');
    };

    window.closeInvoiceAIModal = function() {
      document.getElementById('modalInvoiceAI').classList.add('hidden');
    };

    window.confirmSaveInvoice = async function() {
      if (!window.pendingParsedInvoice || !window.supabaseClient) return;

      window.closeInvoiceAIModal();
      showLoading('A gravar na Base de Dados...', 'A sincronizar fatura e transações no Supabase', 20, 'A preparar dados');

      try {
        const invoiceData = {
          user_id: window.currentUser.id,
          bank_name: document.getElementById('aiBankName').value,
          due_date: document.getElementById('aiDueDate').value,
          total_amount: parseFloat(document.getElementById('aiTotalAmount').value),
          status: 'open'
        };

        animateProgressTo(50, 'A gravar fatura principal');
        const { data: invResult, error: invErr } = await window.supabaseClient
          .from('invoices')
          .insert([invoiceData])
          .select();

        if (invErr) throw invErr;
        const invoiceId = invResult[0].id;

        const transRows = (window.pendingParsedInvoice.items || []).map(item => ({
          user_id: window.currentUser.id,
          invoice_id: invoiceId,
          description: item.description,
          amount: item.amount,
          date: item.date || invoiceData.due_date,
          category: item.category || 'Outros',
          installment_info: (item.installment_display && item.installment_display !== '-') ? item.installment_display : null,
          installment_total: item.installment_total || null,
          type: 'expense'
        }));

        if (transRows.length > 0) {
          animateProgressTo(80, 'A gravar lançamentos individuais');
          await window.supabaseClient.from('transactions').insert(transRows);
        }

        animateProgressTo(100, 'Gravação concluída');
        addLog(`Fatura guardada na base de dados com ${transRows.length} itens.`);

        setTimeout(() => {
          hideLoading();
          alert('Fatura e itens guardados com sucesso!');
          window.loadAllData();
        }, 400);
      } catch (e) {
        hideLoading();
        alert('Erro ao guardar fatura: ' + e.message);
      }
    };

    window.assignSingleMember = async function(txId, memberId) {
      if (!window.supabaseClient) return;
      const mId = memberId ? memberId : null;

      try {
        const { error } = await window.supabaseClient
          .from('transactions')
          .update({ member_id: mId })
          .eq('id', txId);

        if (error) throw error;

        const tx = window.currentTransactions.find(t => t.id === txId);
        if (tx) tx.member_id = mId;

        renderDashboard();
        renderMembersList();
        renderCharts();

        const memberObj = window.currentMembers.find(m => m.id === mId);
        addLog(`Transação ${tx ? tx.description : txId} atribuída diretamente para: ${memberObj ? memberObj.name : 'Geral'}`);
      } catch (err) {
        alert('Erro ao vincular membro: ' + err.message);
        window.loadAllData();
      }
    };

    window.openSplitTransactionModal = function(txId) {
      const tx = window.currentTransactions.find(t => t.id === txId);
      if (!tx) return;
      window.selectedTransactionToSplit = tx;

      const invoice = window.currentInvoices.find(i => i.id === tx.invoice_id);
      const bankName = invoice ? invoice.bank_name : 'Santander';

      document.getElementById('splitTxDesc').textContent = tx.description;
      document.getElementById('splitTxDate').innerHTML = `<i class="ph-bold ph-calendar"></i> ${tx.date}`;
      document.getElementById('splitTxBank').innerHTML = `<i class="ph-bold ph-bank"></i> ${bankName}`;
      document.getElementById('splitTxCategory').innerHTML = `<i class="ph-bold ph-tag"></i> ${tx.category || 'Outros'}`;
      document.getElementById('splitTxTotal').textContent = `R$ ${Number(tx.amount).toFixed(2)}`;

      const sel1 = document.getElementById('splitMember1');
      const sel2 = document.getElementById('splitMember2');
      sel1.innerHTML = '';
      sel2.innerHTML = '';

      if (window.currentMembers.length === 0) {
        return alert('Cadastre primeiro membros na aba "Membros" para poder dividir transações.');
      }

      window.currentMembers.forEach((m) => {
        const o1 = document.createElement('option');
        o1.value = m.id;

    window.onSplitInputChange = function(val) {
      let v = parseInt(val) || 0;
      if (v < 0) v = 0;
      if (v > 100) v = 100;
      document.getElementById('splitSlider').value = v;
      recalculateSplit();
    };

    function recalculateSplit() {
      if (!window.selectedTransactionToSplit) return;
      const total = Number(window.selectedTransactionToSplit.amount);
      const p1 = parseInt(document.getElementById('splitSlider').value) || 0;
      const p2 = 100 - p1;

      const sel1 = document.getElementById('splitMember1');
      const sel2 = document.getElementById('splitMember2');
      const name1 = sel1.options[sel1.selectedIndex]?.textContent || 'Usuário 1';
      const name2 = sel2.options[sel2.selectedIndex]?.textContent || 'Usuário 2';

      const v1 = (total * (p1 / 100));
      const v2 = total - v1;

      document.getElementById('cardMember1Label').textContent = name1;
      document.getElementById('cardMember1Amount').textContent = `R$ ${v1.toFixed(2)}`;
      document.getElementById('cardMember1Percent').textContent = `${p1}%`;

      document.getElementById('cardMember2Label').textContent = name2;
      document.getElementById('cardMember2Amount').textContent = `R$ ${v2.toFixed(2)}`;
      document.getElementById('cardMember2Percent').textContent = `${p2}%`;
    }

    window.executeSplitTransaction = async function() {
      if (!window.selectedTransactionToSplit || !window.supabaseClient) return;

      const m1 = document.getElementById('splitMember1').value;
      const m2 = document.getElementById('splitMember2').value;
      const p1 = parseInt(document.getElementById('splitSlider').value) || 0;

      if (!m1 || !m2) return alert('Selecione ambos os membros.');
      if (m1 === m2) return alert('Selecione membros diferentes para realizar a divisão.');

      const total = Number(window.selectedTransactionToSplit.amount);
      const val1 = Number((total * (p1 / 100)).toFixed(2));
      const val2 = Number((total - val1).toFixed(2));

      try {
        const { error: updErr } = await window.supabaseClient
          .from('transactions')
          .update({
            amount: val1,
            member_id: m1,
            installment_info: window.selectedTransactionToSplit.installment_info ? `${window.selectedTransactionToSplit.installment_info} (Rateio)` : '(Rateio)'
          })
          .eq('id', window.selectedTransactionToSplit.id);

        if (updErr) throw updErr;

        const { error: insErr } = await window.supabaseClient
          .from('transactions')
          .insert([{
            user_id: window.currentUser.id,
            invoice_id: window.selectedTransactionToSplit.invoice_id,
            member_id: m2,
            description: window.selectedTransactionToSplit.description,
            amount: val2,
            date: window.selectedTransactionToSplit.date,
            category: window.selectedTransactionToSplit.category,
            installment_info: window.selectedTransactionToSplit.installment_info ? `${window.selectedTransactionToSplit.installment_info} (Rateio)` : '(Rateio)',
            installment_total: window.selectedTransactionToSplit.installment_total || null,
            type: 'expense'
          }]);

        if (insErr) throw insErr;

        addLog(`Transação dividida: ${window.selectedTransactionToSplit.description} (R$ ${val1.toFixed(2)} / R$ ${val2.toFixed(2)})`);
        window.closeSplitModal();
        alert('Transação dividida com sucesso!');
        window.loadAllData();
      } catch (err) {
        alert('Erro ao dividir transação: ' + err.message);
      }
    };

      const alreadyPaid = window.currentPayments.filter(p => p.member_id === member.id).reduce((a, b) => a + Number(b.amount), 0);

      text += `*Referência:* ${monthNames[now.getMonth()]}/${now.getFullYear()}\n`;

      const name = document.getElementById('editMemberName').value.trim();
      const email = document.getElementById('editMemberEmail').value.trim();
      const phone = document.getElementById('editMemberPhone').value.trim();

      if (!name) return alert('O nome do membro não pode ficar vazio.');

      try {
        const { error } = await window.supabaseClient
          .from('members')
          .update({ name, email, phone })
          .eq('id', id);

        if (error) throw error;

        addLog(`Membro atualizado: ${name}`);
        window.closeEditMemberModal();
        alert('Cadastro de membro atualizado com sucesso!');
        window.loadAllData();
      } catch (err) {
        alert('Erro ao atualizar membro: ' + err.message);
      }
    };

    window.openNewMemberModal = function() { document.getElementById('modalNewMember').classList.remove('hidden'); };
    window.closeNewMemberModal = function() { document.getElementById('modalNewMember').classList.add('hidden'); };

    window.saveNewMember = async function() {
      const name = document.getElementById('inputMemberName').value.trim();
      const email = document.getElementById('inputMemberEmail').value.trim();
      const phone = document.getElementById('inputMemberPhone').value.trim();
      if (!name) return alert('Informe o nome do membro.');

      await window.supabaseClient.from('members').insert([{ user_id: window.currentUser.id, name, email, phone }]);
      addLog(`Membro adicionado: ${name}`);
      document.getElementById('inputMemberName').value = '';
      document.getElementById('inputMemberEmail').value = '';
      document.getElementById('inputMemberPhone').value = '';
      window.closeNewMemberModal();
      window.loadAllData();
    };

    window.openNewBankModal = function() { document.getElementById('modalNewBank').classList.remove('hidden'); };
    window.closeNewBankModal = function() { document.getElementById('modalNewBank').classList.add('hidden'); };

    window.saveNewBank = async function() {
      const name = document.getElementById('inputBankName').value.trim();
      if (!name) return alert('Informe o nome do banco.');

      await window.supabaseClient.from('banks').insert([{ user_id: window.currentUser.id, name }]);
      addLog(`Banco adicionado: ${name}`);
      document.getElementById('inputBankName').value = '';
      window.closeNewBankModal();
      window.loadAllData();
    };

    window.openLogsModal = function() {
      const logs = JSON.parse(localStorage.getItem('set_logs') || '[]');
      const container = document.getElementById('appLogsConsole');
      if (container) container.innerHTML = logs.length ? logs.map(l => `<div>${l}</div>`).join('') : '<div>Nenhum log gravado.</div>';
      document.getElementById('modalLogs').classList.remove('hidden');
    };

    window.closeLogsModal = function() { document.getElementById('modalLogs').classList.add('hidden'); };

    window.clearAppLogs = function() {
      localStorage.removeItem('set_logs');
      const container = document.getElementById('appLogsConsole');
      if (container) container.innerHTML = '<div>Logs limpos com sucesso.</div>';
    };

    window.openResetInvoicesModal = function() {
      if (window.currentInvoices.length === 0) return alert('Não há faturas para zerar.');
      document.getElementById('modalResetInvoices').classList.remove('hidden');
    };

    window.closeResetInvoicesModal = function() {
      document.getElementById('modalResetInvoices').classList.add('hidden');
    };

    window.executeResetAllInvoices = async function() {
      if (!window.supabaseClient || !window.currentUser) return;
      try {
        await window.supabaseClient.from('transactions').delete().eq('user_id', window.currentUser.id).not('invoice_id', 'is', null);
        await window.supabaseClient.from('invoices').delete().eq('user_id', window.currentUser.id);

        addLog('Reset total de faturas e compras executado.');
        window.closeResetInvoicesModal();
        alert('Todas as faturas foram zeradas com sucesso!');
        window.loadAllData();
      } catch (err) {
        alert('Erro ao zerar faturas: ' + err.message);
      }
    };

    window.deleteSingleInvoice = async function(invoiceId) {
      if (!confirm('Deseja eliminar esta fatura e todos os seus itens?')) return;
      if (!window.supabaseClient || !window.currentUser) return;

      try {
        await window.supabaseClient.from('transactions').delete().eq('invoice_id', invoiceId);
        await window.supabaseClient.from('invoices').delete().eq('id', invoiceId);

        addLog(`Fatura excluída: ${invoiceId}`);
        window.loadAllData();
      } catch (err) {
        alert('Erro ao eliminar fatura: ' + err.message);
      }
    };

    window.exportCSV = function() {
      if (window.currentTransactions.length === 0) return alert('Sem lançamentos para exportar.');
      let csv = 'ID;Descricao;Data;Valor;Categoria;Parcela;QtdTotal;Membro\n';
      window.currentTransactions.forEach(t => {
        const member = window.currentMembers.find(m => m.id === t.member_id);
        csv += `"${t.id}";"${t.description}";"${t.date}";"${t.amount}";"${t.category}";"${t.installment_info || ''}";"${t.installment_total || ''}";"${member ? member.name : ''}"\n`;
      });
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `set_relatorio_${new Date().toISOString().split('T')[0]}.csv`;
      a.click();
    };

    window.openConfigModal = function() {
      try {
        document.getElementById('inputGeminiKey').value = localStorage.getItem('set_gemini_key') || '';
      } catch (e) {}
      document.getElementById('modalConfig').classList.remove('hidden');
    };

    window.closeConfigModal = function() { document.getElementById('modalConfig').classList.add('hidden'); };

    window.saveGeminiKey = function() {
      const k = document.getElementById('inputGeminiKey').value.trim();
      try {
        localStorage.setItem('set_gemini_key', k);
      } catch (e) {}
      addLog('Chave Gemini configurada pelo utilizador.');
      window.closeConfigModal();
    };

    window.addEventListener('DOMContentLoaded', async () => {
      window.initTheme();

      const form = document.getElementById('formAuth');
      if (form) {
        form.addEventListener('submit', window.handleAuthSubmit);
      }

      if (window.supabaseClient) {
        window.supabaseClient.auth.onAuthStateChange((event, session) => {
          if (session && session.user) {
            window.currentUser = session.user;
            window.showApp();
            window.loadAllData().catch(err => console.warn(err));
          } else {
            window.currentUser = null;
            window.showAuth();
          }
        });
      } else {
        window.showAuth();
      }

      document.addEventListener('click', (e) => {
        const dd = document.getElementById('setMenuDropdown');
        const btn = document.getElementById('btnSetMenu');
        if (dd && btn && !dd.contains(e.target) && !btn.contains(e.target)) {
          dd.classList.add('hidden');
        }
      });
    });
  </script>
</body>
</html>
