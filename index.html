<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="SET Web">
  <title>SET Web - Sistema de Faturas & Rateio</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='100%25' x2='100%25' y2='0%25'%3E%3Cstop offset='0%25' stop-color='%23059669'/%3E%3Cstop offset='100%25' stop-color='%2334d399'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Cpath d='M18 16a2 2 0 0 1 2-2h24a2 2 0 0 1 2 2v34l-4.67-3.5-4.66 3.5-4.67-3.5-4.67 3.5-4.66-3.5L18 50V16zm8 10h12v3H26v-3zm0 8h12v3H26v-3z' fill='%23ffffff'/%3E%3C/svg%3E">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='100%25' x2='100%25' y2='0%25'%3E%3Cstop offset='0%25' stop-color='%23059669'/%3E%3Cstop offset='100%25' stop-color='%2334d399'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Cpath d='M18 16a2 2 0 0 1 2-2h24a2 2 0 0 1 2 2v34l-4.67-3.5-4.66 3.5-4.67-3.5-4.67 3.5-4.66-3.5L18 50V16zm8 10h12v3H26v-3zm0 8h12v3H26v-3z' fill='%23ffffff'/%3E%3C/svg%3E">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <script>
    if (window.pdfjsLib) {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 50: '#ecfdf5', 100: '#d1fae5', 500: '#10b981', 600: '#059669', 700: '#047857' }
          }
        }
      }
    };
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    :root { --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px); }
    html, body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; min-height: 100vh; min-height: 100dvh; }
    .app-header-safe { padding-top: max(12px, calc(var(--sat) + 8px)); }
    .app-bottom-nav-safe { padding-bottom: max(10px, calc(var(--sab) + 12px)); }
    .app-main-safe { padding-bottom: max(95px, calc(var(--sab) + 105px)); }
    .app-modal-sheet { padding-bottom: max(20px, calc(var(--sab) + 24px)) !important; max-height: calc(90dvh - var(--sat)); }
    .custom-scrollbar::-webkit-scrollbar { width: 4px; height: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #334155; border-radius: 9999px; }
    @keyframes shimmerBar { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    .animate-shimmer { background: linear-gradient(90deg, #10b981 0%, #34d399 25%, #6ee7b7 50%, #34d399 75%, #10b981 100%); background-size: 200% 100%; animation: shimmerBar 2s linear infinite; }
    @media print { body * { visibility: hidden; } #printArea, #printArea * { visibility: visible; } #printArea { position: absolute; left: 0; top: 0; width: 100%; } }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 antialiased min-h-screen transition-colors duration-200 select-none">

  <!-- 1. TELA DE AUTENTICAÇÃO -->
  <div id="authScreen" class="min-h-[100dvh] w-full flex flex-col justify-center items-center px-4 py-8 bg-slate-950">
    <div class="w-full max-w-sm flex flex-col gap-5">
      <div class="text-center">
        <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-brand-600 to-emerald-400 flex items-center justify-center text-white mx-auto shadow-lg shadow-brand-500/20 mb-3.5"><i class="ph-bold ph-receipt text-3xl"></i></div>
        <h2 class="text-2xl font-black tracking-tight text-white">SET Web</h2>
        <p class="text-xs text-slate-400 mt-1">Gestão Completa de Cartões & Rateio de Despesas</p>
      </div>
      <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 sm:p-7 shadow-xl flex flex-col gap-4">
        <div class="flex border border-slate-700/80 rounded-xl p-1 bg-slate-800/80 text-xs font-semibold">
          <button type="button" id="tabAuthLogin" onclick="setAuthMode('login')" class="flex-1 py-2.5 rounded-lg bg-slate-700 text-white shadow-sm transition">Entrar</button>
          <button type="button" id="tabAuthRegister" onclick="setAuthMode('register')" class="flex-1 py-2.5 rounded-lg text-slate-400 transition">Criar Conta</button>
        </div>
        <form id="formAuth" onsubmit="return handleAuthSubmit(event);" class="flex flex-col gap-4">
          <div><label class="block text-xs font-bold text-slate-300 mb-1.5">E-mail</label><input type="email" id="authEmail" required placeholder="seu@email.com" class="w-full px-3.5 py-3 text-sm rounded-xl border border-slate-700 bg-slate-800 text-white focus:outline-none focus:border-brand-500 transition"></div>
          <div><label class="block text-xs font-bold text-slate-300 mb-1.5">Senha</label><input type="password" id="authPassword" required minlength="6" placeholder="Mínimo 6 caracteres" class="w-full px-3.5 py-3 text-sm rounded-xl border border-slate-700 bg-slate-800 text-white focus:outline-none focus:border-brand-500 transition"></div>
          <button type="submit" id="btnAuthSubmit" class="w-full mt-1 py-3.5 text-sm font-bold rounded-xl bg-brand-600 hover:bg-brand-700 active:scale-[0.99] text-white shadow-md shadow-brand-600/25 transition">Aceder ao SET</button>
        </form>
      </div>
      <div class="flex items-center justify-center gap-2 text-xs text-slate-400">
        <button type="button" onclick="toggleTheme()" class="hover:text-slate-200 transition flex items-center gap-1 font-semibold"><i class="ph-bold ph-circle-half"></i><span>Alternar tema</span></button>
      </div>
    </div>
  </div>

  <!-- 2. APLICAÇÃO PRINCIPAL -->
  <div id="appContainer" class="hidden min-h-screen flex flex-col">
    <header class="app-header-safe bg-slate-900 border-b border-slate-800 sticky top-0 z-30">
      <div class="max-w-7xl mx-auto px-4 pb-3 flex items-center justify-between gap-2">
        <div class="flex items-center space-x-2.5">
          <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-brand-600 to-emerald-400 flex items-center justify-center text-white shadow-md shadow-brand-500/20"><i class="ph-bold ph-receipt text-xl"></i></div>
          <div>
            <div class="flex items-center gap-1.5">
              <h1 class="text-lg font-bold tracking-tight text-white leading-none">SET Web</h1>
              <span class="text-[9px] font-semibold uppercase px-1.5 py-0.5 rounded-full bg-emerald-950 text-emerald-300 border border-emerald-800">Sistema Oficial</span>
            </div>
            <p class="text-[11px] text-slate-400 mt-0.5 hidden sm:block">Gestão de Cartões, Faturas & Empréstimos</p>
          </div>
        </div>
        <div class="flex items-center gap-2">
          <button type="button" onclick="triggerInvoiceUpload()" class="px-3.5 py-2 text-xs font-bold rounded-xl bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-700 hover:to-teal-700 text-white flex items-center gap-1.5 shadow-sm transition"><i class="ph-bold ph-sparkle text-amber-300 text-sm"></i><span>Importar Fatura IA</span></button>
          <input type="file" id="pdfFileInput" accept=".pdf,.csv,.ofx" onchange="handleFileSelected(event)" class="hidden">
          <div class="relative">
            <button type="button" onclick="toggleSetMenuDropdown()" id="btnSetMenu" class="px-3 py-2 text-xs font-bold rounded-xl bg-slate-800 border border-slate-700 hover:bg-slate-700 text-slate-200 flex items-center gap-1.5 transition"><i class="ph-bold ph-list"></i><span class="hidden sm:inline">Menu Funções</span><i class="ph-bold ph-caret-down text-[10px]"></i></button>
            <div id="setMenuDropdown" class="hidden absolute right-0 mt-2 w-72 bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl p-2 z-50 divide-y divide-slate-800">
              <div class="py-1">
                <button type="button" onclick="triggerInvoiceUpload(); closeSetMenuDropdown();" class="w-full text-left px-3 py-2 text-xs font-medium rounded-lg hover:bg-slate-800 flex items-center gap-2"><i class="ph-bold ph-file-arrow-up text-emerald-400"></i><span>Importar Fatura</span></button>
                <button type="button" onclick="switchTab('transactions'); closeSetMenuDropdown();" class="w-full text-left px-3 py-2 text-xs font-medium rounded-lg hover:bg-slate-800 flex items-center gap-2"><i class="ph-bold ph-scissors text-amber-400"></i><span>Dividir / Ratear Transações</span></button>
                <button type="button" onclick="switchTab('members'); closeSetMenuDropdown();" class="w-full text-left px-3 py-2 text-xs font-medium rounded-lg hover:bg-slate-800 flex items-center gap-2"><i class="ph-bold ph-users text-indigo-400"></i><span>Catalogar Membros / Usuários</span></button>
                <button type="button" onclick="openGenerateMemberPdfModal(); closeSetMenuDropdown();" class="w-full text-left px-3 py-2 text-xs font-medium rounded-lg hover:bg-slate-800 flex items-center gap-2"><i class="ph-bold ph-file-pdf text-rose-400"></i><span>Gerar Fatura Individual (PDF)</span></button>
              </div>
              <div class="py-1">
                <button type="button" onclick="loadAllData(); closeSetMenuDropdown();" class="w-full text-left px-3 py-2 text-xs font-medium rounded-lg hover:bg-slate-800 flex items-center gap-2"><i class="ph-bold ph-arrows-clockwise text-blue-400"></i><span>Atualizar Painel (Sincronizar)</span></button>
                <button type="button" onclick="exportCSV(); closeSetMenuDropdown();" class="w-full text-left px-3 py-2 text-xs font-medium rounded-lg hover:bg-slate-800 flex items-center gap-2"><i class="ph-bold ph-table text-emerald-400"></i><span>Relatórios / Exportar CSV</span></button>
                <button type="button" onclick="openLogsModal(); closeSetMenuDropdown();" class="w-full text-left px-3 py-2 text-xs font-medium rounded-lg hover:bg-slate-800 flex items-center gap-2"><i class="ph-bold ph-terminal text-slate-400"></i><span>Ver / Limpar Logs</span></button>
              </div>
              <div class="py-1">
                <button type="button" onclick="openResetInvoicesModal(); closeSetMenuDropdown();" class="w-full text-left px-3 py-2 text-xs font-medium text-rose-400 rounded-lg hover:bg-rose-950/40 flex items-center gap-2"><i class="ph-bold ph-trash"></i><span>Resetar Transações & Faturas</span></button>
                <button type="button" onclick="openConfigModal(); closeSetMenuDropdown();" class="w-full text-left px-3 py-2 text-xs font-medium rounded-lg hover:bg-slate-800 flex items-center gap-2"><i class="ph-bold ph-gear text-slate-300"></i><span>Configurações & Chave Gemini</span></button>
              </div>
            </div>
          </div>
          <button type="button" onclick="signOut()" class="p-2 text-rose-400 hover:text-rose-300 rounded-lg transition" title="Terminar Sessão"><i class="ph-bold ph-sign-out text-lg"></i></button>
        </div>
      </div>
    </header>

    <main class="app-main-safe max-w-7xl mx-auto px-3.5 sm:px-6 lg:px-8 py-4 w-full flex-1 flex flex-col gap-4">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3 gap-2 overflow-x-auto custom-scrollbar">
        <div class="flex items-center gap-2 shrink-0">
          <button type="button" onclick="switchTab('dashboard')" id="tabNavDash" class="px-4 py-2 rounded-lg text-sm font-semibold transition bg-emerald-950/40 text-emerald-300 border border-emerald-800 flex items-center gap-2"><i class="ph-bold ph-chart-pie-slice"></i><span>Painel</span></button>
          <button type="button" onclick="switchTab('invoices')" id="tabNavInvoices" class="px-4 py-2 rounded-lg text-sm font-medium transition text-slate-400 hover:text-white hover:bg-slate-800 flex items-center gap-2"><i class="ph-bold ph-credit-card"></i><span>Faturas</span><span id="badgeInvoicesCount" class="text-[11px] px-1.5 py-0.5 rounded-full bg-emerald-950 text-emerald-300 font-bold">0</span></button>
          <button type="button" onclick="switchTab('transactions')" id="tabNavTrans" class="px-4 py-2 rounded-lg text-sm font-medium transition text-slate-400 hover:text-white hover:bg-slate-800 flex items-center gap-2"><i class="ph-bold ph-arrows-split"></i><span>Lançamentos & Rateio</span></button>
          <button type="button" onclick="switchTab('members')" id="tabNavMembers" class="px-4 py-2 rounded-lg text-sm font-medium transition text-slate-400 hover:text-white hover:bg-slate-800 flex items-center gap-2"><i class="ph-bold ph-users"></i><span>Membros</span></button>
          <button type="button" onclick="switchTab('banks')" id="tabNavBanks" class="px-4 py-2 rounded-lg text-sm font-medium transition text-slate-400 hover:text-white hover:bg-slate-800 flex items-center gap-2"><i class="ph-bold ph-bank"></i><span>Bancos & Cartões</span></button>
        </div>
      </div>

      <!-- ABA 1: PAINEL -->
      <div id="viewDashboard" class="flex flex-col gap-4">
        <div class="grid grid-cols-2 lg:grid-cols-4 gap-3.5">
          <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800 shadow-sm flex flex-col justify-between">
            <div class="flex items-center justify-between"><span class="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Faturas em Aberto</span><div class="w-7 h-7 rounded-lg bg-rose-500/10 text-rose-400 flex items-center justify-center text-sm"><i class="ph-bold ph-clock"></i></div></div>
            <div class="mt-2.5"><h3 id="cardOpenInvoices" class="text-2xl font-black text-rose-400 tracking-tight">R$ 0,00</h3><p id="cardOpenCount" class="text-[11px] text-slate-400 font-medium mt-0.5">0 faturas pendentes</p></div>
          </div>
          <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800 shadow-sm flex flex-col justify-between">
            <div class="flex items-center justify-between"><span class="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Total Lançamentos</span><div class="w-7 h-7 rounded-lg bg-emerald-500/10 text-emerald-400 flex items-center justify-center text-sm"><i class="ph-bold ph-receipt"></i></div></div>
            <div class="mt-2.5"><h3 id="cardTotalTransactions" class="text-2xl font-black text-white tracking-tight">R$ 0,00</h3><p id="cardTransCount" class="text-[11px] text-slate-400 font-medium mt-0.5">0 itens catalogados</p></div>
          </div>
          <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800 shadow-sm flex flex-col justify-between">
            <div class="flex items-
